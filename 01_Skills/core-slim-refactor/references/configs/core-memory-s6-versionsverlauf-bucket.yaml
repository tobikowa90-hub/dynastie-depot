      - "2026-05-21"
    case_sensitive: true
  archive:
    path: "05_Archiv/CORE-MEMORY-§6-Versionsverlauf-v3.7-Era-archiv.md"
    header_template: |
      # Versionsverlauf v3.7-Era — Verbatim Archive (17.04.-07.05.2026)

      Cut: {timestamp}
      Source: {target_file} {section}
      Total Rows: {n_rows}
      Trigger: T2-Empirie-Test #1 für PIPELINE #81 v0.2.0 Re-Defer-Gate.
  pointer:
    insert_at: chronological
    template: "| 2026-05-15 | **v3.7-Era-Versionsverlauf** | bucket | konsolidiert {n_rows} Rows (Verbatim-Archiv) → [Archive]({archive_link}) |"

backlink_scan:
