  section: "## 6. System-Upgrades & Versionsverlauf"
  section_anchor_alt: null
  append_only_immutable: false

pattern: bucket-archive

bucket_archive:
  classify:
    by: keyword
    keywords:
      - "2026-04-17"
      - "2026-04-18"
      - "2026-04-19"
      - "2026-04-22"
      - "2026-04-24"
      - "2026-05-07"
