      Aktueller Stand (28.04.2026 spätabends, post-V Rescoring-Revert nach Codex-HIGH-1+HIGH-2-Review D3→D2): 7× D4/D3 (Gewicht 1.0) + 1× D2 (V, Gewicht 0.5) + 3× 🔴 eingefroren (MSFT + APH + AVGO)
