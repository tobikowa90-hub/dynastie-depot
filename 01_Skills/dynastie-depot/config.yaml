    beschreibung: "Formelle Berechnungsregel für !Rebalancing. Verbindlich. v3.4-Stand."
    gewichte: "D4/D3 (kein 🔴 FLAG) = 1.0 | D2 (kein 🔴 FLAG) = 0.5 | D1 / 🔴 FLAG = 0.0"
    formel: "Einzelrate = Aktien-Budget (285€) / Σ Gewichte × Eigengewicht"
